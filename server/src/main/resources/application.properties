spring.application.name=point

# docker-compose.yml 의 mysql 을 자동 감지하는 것은 bootRun 뿐이다 — 묶은 jar 로 띄우면
# 그 기능이 꺼져 있어 접속 정보가 없다. 개발용 값이라 compose 와 같은 것을 적어 둔다.
spring.datasource.url=jdbc:mysql://localhost:3306/point
spring.datasource.username=point
spring.datasource.password=point

spring.jpa.open-in-view=false
# 스키마는 Flyway 가 만든다. validate 는 컬럼의 존재와 타입만 보므로 널 허용이 어긋나는
# 것은 SchemaGuard 가 본다 — update 는 행이 있는 표에 NOT NULL 을 못 더한 채 지나간다.
spring.jpa.hibernate.ddl-auto=validate

# 이 파일의 값은 전부 개발용이다. 운영에서는 point.dev-defaults=false 로 두면 덮지 않은
# 값이 남아 있을 때 부팅이 선다 — 안 덮은 것을 배포하는 날 알아차릴 계기가 달리 없다.
point.dev-defaults=true

# 시드 계정의 암호는 공개된 값이다.
point.seed-users=true

# 개발용 시크릿 — 커밋해도 되는 값이다. 운영에서는 환경변수로 덮어써야 한다.
point.jwt.secret=fTF8TbC5y7deokUmr/2fcTwdpZ93tmD4rW9kjTabTDoVcr0HGRAjfw4OP++kNdEu
point.jwt.access-ttl=15m
point.jwt.refresh-ttl=14d

