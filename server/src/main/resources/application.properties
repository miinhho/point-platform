spring.application.name=point

# docker-compose.yml 의 mysql 서비스를 자동 감지해 접속 정보를 구성한다 (spring-boot-docker-compose).
spring.jpa.open-in-view=false
# 스키마는 Flyway 가 만든다. Hibernate 는 엔티티와 어긋나면 부팅을 막는 역할만 한다 —
# update 는 기존 행이 있는 테이블에 NOT NULL 컬럼을 더하지 못한 채 조용히 지나간다.
spring.jpa.hibernate.ddl-auto=validate

# 개발용 시크릿 — 커밋해도 되는 값이다. 운영에서는 환경변수로 덮어써야 한다.
point.jwt.secret=fTF8TbC5y7deokUmr/2fcTwdpZ93tmD4rW9kjTabTDoVcr0HGRAjfw4OP++kNdEu
point.jwt.access-ttl=15m
point.jwt.refresh-ttl=14d

