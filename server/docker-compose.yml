services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: point
      MYSQL_USER: point
      MYSQL_PASSWORD: point
      MYSQL_ROOT_PASSWORD: point
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppoint"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
